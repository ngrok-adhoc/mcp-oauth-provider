name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke-test the npm tarball
        run: |
          version=$(node -p 'require("./package.json").version')
          scratch=$(mktemp -d)
          npm pack --pack-destination "$scratch"
          cd "$scratch"
          npm init -y
          npm install --no-audit --no-fund "./mcp-oauth-provider-$version.tgz"
          test "$(./node_modules/.bin/mcp-oauth-provider --version)" = "$version"
          ./node_modules/.bin/mcp-oauth-provider --help
          node -e 'require("@ngrok/ngrok"); console.log("Native ngrok SDK loaded")'
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t mcp-oauth-provider:ci .
      - run: docker run --rm mcp-oauth-provider:ci --version
      - run: docker run --rm mcp-oauth-provider:ci --help
      - run: docker run --rm --entrypoint node mcp-oauth-provider:ci -e 'require("@ngrok/ngrok"); console.log("Native ngrok SDK loaded")'
