name: Publish image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish from main (leave blank for a dry run)
        type: string
  push:
    # Main warms the cache; only explicit release tags publish an image.
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - tsconfig.json
      - assets/**
      - bin/**
      - lib/**
      - .github/workflows/publish-image.yml

concurrency:
  group: mcp-oauth-provider-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ngrok-adhoc/mcp-oauth-provider-release
  CANDIDATE: localhost:5000/mcp-oauth-provider:candidate

jobs:
  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    env:
      VERIFY_IMAGE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG != '' && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
      - name: Resolve image source
        id: source
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
               [[ "$RELEASE_TAG" != "v$(node -p 'require("./package.json").version')" ]]; then
              echo "Release tag must be vMAJOR.MINOR.PATCH and match package.json." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Release tags must point at a commit on main." >&2
              exit 1
            fi
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - name: Start a runner-local registry
        if: env.VERIFY_IMAGE == 'true'
        run: |
          docker run --detach --publish 127.0.0.1:5000:5000 \
            registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
          curl --fail --silent --show-error --retry 5 --retry-all-errors http://127.0.0.1:5000/v2/
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.VERIFY_IMAGE == 'true' }}
          tags: ${{ env.CANDIDATE }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=mcp-oauth-provider
          cache-to: type=gha,scope=mcp-oauth-provider,mode=max
          # Recheck Alpine's package repository on each build.
          no-cache-filters: runtime
          provenance: ${{ env.VERIFY_IMAGE == 'true' }}
          sbom: ${{ env.VERIFY_IMAGE == 'true' }}
      - name: Scan and smoke-test both platform manifests
        if: env.VERIFY_IMAGE == 'true'
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          repository=${CANDIDATE%:*}
          index=$(docker buildx imagetools inspect --raw "$repository@$INDEX_DIGEST")
          version=$(node -p 'require("./package.json").version')
          for arch in amd64 arm64; do
            digest=$(jq -er --arg arch "$arch" \
              '.manifests | map(select(.platform.os == "linux" and .platform.architecture == $arch)) | if length == 1 then .[0].digest else error("Expected exactly one manifest for " + $arch) end' \
              <<< "$index")
            image="$repository@$digest"
            echo "Checking linux/$arch at $digest"
            docker pull --platform "linux/$arch" "$image"
            bash scripts/scan-image.sh "$image"
            bash scripts/check-image.sh "$image" "$version"
          done
      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        if: env.VERIFY_IMAGE == 'true'
        with:
          release: v0.11.7
      - name: Log in to GitHub Container Registry
        if: env.RELEASE_TAG != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified index by digest
        if: env.VERIFY_IMAGE == 'true'
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          regctl registry set localhost:5000 --tls disabled
          repository=${CANDIDATE%:*}
          if [[ -n "$RELEASE_TAG" ]]; then
            destination="$IMAGE"
            tags=("$RELEASE_TAG" "$RELEASE_VERSION" "sha-$SOURCE_SHA" latest)
          else
            destination="localhost:5000/mcp-oauth-provider-verified"
            tags=(dry-run)
          fi
          for tag in "${tags[@]}"; do
            regctl image copy "$repository@$INDEX_DIGEST" "$destination:$tag"
            test "$(regctl image digest "$destination:$tag")" = "$INDEX_DIGEST"
          done
