name: Publish image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish from main
        type: string
  push:
    # Main warms the cache; only explicit release tags publish an image.
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - tsconfig.json
      - assets/**
      - bin/**
      - lib/**
      - .github/workflows/publish-image.yml

concurrency:
  group: mcp-oauth-provider-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ngrok-adhoc/mcp-oauth-provider-release

jobs:
  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && inputs.tag != '')
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG != '' && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
      - name: Resolve image source
        id: source
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
               [[ "$RELEASE_TAG" != "v$(node -p 'require("./package.json").version')" ]]; then
              echo "Release tag must be vMAJOR.MINOR.PATCH and match package.json." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Release tags must point at a commit on main." >&2
              exit 1
            fi
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: env.RELEASE_TAG != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=${{ steps.source.outputs.version }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=sha-${{ steps.source.outputs.sha }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.RELEASE_TAG != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcp-oauth-provider
          cache-to: type=gha,scope=mcp-oauth-provider,mode=max
          provenance: ${{ env.RELEASE_TAG != '' }}
          sbom: ${{ env.RELEASE_TAG != '' }}
